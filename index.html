<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BMI Calculator</title>
  <meta name="theme-color" content="#2B5FB0">
  <meta name="description" content="BMI Calculator — a practical health tool built with HTML, CSS, and minimal JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
<main>
  <div class="card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Body Mass Index — quick health check</p>

    <div class="unit-toggle" id="unit-toggle" data-unit="metric">
      <div class="unit-toggle-thumb" aria-hidden="true"></div>
      <input type="radio" name="unit" id="unit-metric" value="metric" checked>
      <label for="unit-metric">Metric</label>
      <input type="radio" name="unit" id="unit-imperial" value="imperial">
      <label for="unit-imperial">Imperial</label>
    </div>

    <form id="bmi-form" novalidate>
      <!-- Weight -->
      <div class="field-group">
        <label class="field-label" for="weight-kg" id="weight-label">Weight (kg)</label>
        <input type="number" id="weight-kg" inputmode="decimal" step="0.1" placeholder="e.g. 68">
        <input type="number" id="weight-lb" inputmode="decimal" step="0.1" placeholder="e.g. 150" style="display:none;">
        <div class="error-msg" id="weight-error" role="alert"></div>
      </div>

      <!-- Height -->
      <div class="field-group">
        <label class="field-label" id="height-label">Height (cm)</label>
        <input type="number" id="height-cm" inputmode="decimal" step="0.1" placeholder="e.g. 170">
        <div class="field-row" id="height-imperial-row" style="display:none;">
          <div class="field">
            <input type="number" id="height-ft" inputmode="numeric" step="1" placeholder="ft" aria-label="Height, feet">
          </div>
          <div class="field">
            <input type="number" id="height-in" inputmode="decimal" step="0.1" placeholder="in" aria-label="Height, inches">
          </div>
        </div>
        <div class="error-msg" id="height-error" role="alert"></div>
      </div>

      <div class="actions">
        <button type="submit" id="calculate-btn" disabled>Calculate BMI</button>
        <button type="button" id="reset-btn">Reset</button>
      </div>
    </form>

    <div class="result-card" id="result-card" aria-live="polite">
      <div class="result-number" id="result-number">—</div>
      <div class="result-category" id="result-category"></div>
      <div class="result-range" id="result-range"></div>
      <div class="result-formula">BMI = weight ÷ height²</div>
    </div>

    <div class="legend" id="legend">
      <div class="legend-tile" data-cat="under" style="--tile-color:#2B6CB0;">
        <div class="range" style="color:#2B6CB0;">< 18.5</div>
        <div class="name">Underweight</div>
      </div>
      <div class="legend-tile" data-cat="normal" style="--tile-color:#15803D;">
        <div class="range" style="color:#15803D;">18.5 – 24.9</div>
        <div class="name">Normal</div>
      </div>
      <div class="legend-tile" data-cat="over" style="--tile-color:#B45309;">
        <div class="range" style="color:#B45309;">25 – 29.9</div>
        <div class="name">Overweight</div>
      </div>
      <div class="legend-tile" data-cat="obese" style="--tile-color:#B91C1C;">
        <div class="range" style="color:#B91C1C;">≥ 30</div>
        <div class="name">Obese</div>
      </div>
    </div>

    <p class="disclaimer">* For informational purposes only. Not a substitute for professional medical advice.</p>
  </div>

  <footer>© 2026 · Built with HTML, CSS, & minimal JavaScript.</footer>
</main>

<script>
(function () {
  const toggle = document.getElementById('unit-toggle');
  const unitMetric = document.getElementById('unit-metric');
  const unitImperial = document.getElementById('unit-imperial');

  const weightKgInput = document.getElementById('weight-kg');
  const weightLbInput = document.getElementById('weight-lb');
  const heightCmInput = document.getElementById('height-cm');
  const heightFtInput = document.getElementById('height-ft');
  const heightInInput = document.getElementById('height-in');
  const heightImperialRow = document.getElementById('height-imperial-row');
  const weightLabel = document.getElementById('weight-label');
  const heightLabel = document.getElementById('height-label');

  const weightError = document.getElementById('weight-error');
  const heightError = document.getElementById('height-error');

  const form = document.getElementById('bmi-form');
  const calcBtn = document.getElementById('calculate-btn');
  const resetBtn = document.getElementById('reset-btn');

  const resultCard = document.getElementById('result-card');
  const resultNumber = document.getElementById('result-number');
  const resultCategory = document.getElementById('result-category');
  const resultRange = document.getElementById('result-range');
  const legendTiles = document.querySelectorAll('.legend-tile');

  const CATEGORY_COLORS = { under: '#2B6CB0', normal: '#15803D', over: '#B45309', obese: '#B91C1C' };
  const CATEGORY_NAMES = { under: 'Underweight', normal: 'Normal', over: 'Overweight', obese: 'Obese' };

  const LIMITS_METRIC = { minH: 50, maxH: 250, minW: 2, maxW: 300 };
  const LIMITS_IMPERIAL = { minH_ft: 1, minH_in: 8, maxH_ft: 8, maxH_in: 2, minW: 4, maxW: 660 };

  function currentUnit() {
    return unitImperial.checked ? 'imperial' : 'metric';
  }

  // ---- Unit switching ----
  function switchUnit() {
    const unit = currentUnit();
    toggle.dataset.unit = unit;
    clearResult();
    clearErrors();

    if (unit === 'metric') {
      weightKgInput.style.display = '';
      weightLbInput.style.display = 'none';
      heightCmInput.style.display = '';
      heightImperialRow.style.display = 'none';
      weightLabel.textContent = 'Weight (kg)';
      heightLabel.textContent = 'Height (cm)';
    } else {
      weightKgInput.style.display = 'none';
      weightLbInput.style.display = '';
      heightCmInput.style.display = 'none';
      heightImperialRow.style.display = 'flex';
      weightLabel.textContent = 'Weight (lb)';
      heightLabel.textContent = 'Height (ft, in)';
    }
    validate();
  }
  unitMetric.addEventListener('change', switchUnit);
  unitImperial.addEventListener('change', switchUnit);

  // ---- Helpers ----
  function num(input) {
    const v = parseFloat(input.value);
    return Number.isFinite(v) ? v : null;
  }

  function getWeightKg() {
    if (currentUnit() === 'metric') {
      const v = num(weightKgInput);
      return v === null ? null : v;
    }
    const lb = num(weightLbInput);
    return lb === null ? null : lb * 0.45359237;
  }

  function getHeightM() {
    if (currentUnit() === 'metric') {
      const cm = num(heightCmInput);
      return cm === null ? null : cm / 100;
    }
    const ft = num(heightFtInput) || 0;
    const inch = num(heightInInput) || 0;
    if (heightFtInput.value === '' && heightInInput.value === '') return null;
    const totalIn = ft * 12 + inch;
    return totalIn <= 0 ? null : totalIn * 0.0254;
  }

  function clearErrors() {
    weightError.textContent = '';
    heightError.textContent = '';
    weightKgInput.removeAttribute('aria-invalid');
    weightLbInput.removeAttribute('aria-invalid');
    heightCmInput.removeAttribute('aria-invalid');
    heightFtInput.removeAttribute('aria-invalid');
    heightInInput.removeAttribute('aria-invalid');
  }

  function clearResult() {
    resultCard.classList.remove('visible');
    resultNumber.textContent = '—';
    resultNumber.style.color = '';
    resultCategory.textContent = '';
    resultRange.textContent = '';
    legendTiles.forEach(t => t.classList.remove('active'));
  }

  // ---- Validation ----
  function validate() {
    clearErrors();
    let valid = true;
    const unit = currentUnit();

    const weightKg = getWeightKg();
    const heightM = getHeightM();

    // Weight checks
    if (unit === 'metric') {
      if (weightKgInput.value !== '' && weightKg !== null) {
        if (weightKg < LIMITS_METRIC.minW || weightKg > LIMITS_METRIC.maxW) {
          weightError.textContent = `Enter a weight between ${LIMITS_METRIC.minW}–${LIMITS_METRIC.maxW} kg.`;
          weightKgInput.setAttribute('aria-invalid', 'true');
          valid = false;
        }
      } else {
        valid = false;
      }
    } else {
      if (weightLbInput.value !== '' && weightKg !== null) {
        const lb = num(weightLbInput);
        if (lb < LIMITS_IMPERIAL.minW || lb > LIMITS_IMPERIAL.maxW) {
          weightError.textContent = `Enter a weight between ${LIMITS_IMPERIAL.minW}–${LIMITS_IMPERIAL.maxW} lb.`;
          weightLbInput.setAttribute('aria-invalid', 'true');
          valid = false;
        }
      } else {
        valid = false;
      }
    }

    // Height checks
    if (unit === 'metric') {
      if (heightCmInput.value !== '' && heightM !== null) {
        const cm = heightM * 100;
        if (cm < LIMITS_METRIC.minH || cm > LIMITS_METRIC.maxH) {
          heightError.textContent = `Enter a height between ${LIMITS_METRIC.minH}–${LIMITS_METRIC.maxH} cm.`;
          heightCmInput.setAttribute('aria-invalid', 'true');
          valid = false;
        }
      } else {
        valid = false;
      }
    } else {
      if (heightM !== null) {
        const totalIn = heightM / 0.0254;
        const minIn = LIMITS_IMPERIAL.minH_ft * 12 + LIMITS_IMPERIAL.minH_in;
        const maxIn = LIMITS_IMPERIAL.maxH_ft * 12 + LIMITS_IMPERIAL.maxH_in;
        if (totalIn < minIn || totalIn > maxIn) {
          heightError.textContent = `Enter a height between ${LIMITS_IMPERIAL.minH_ft}'${LIMITS_IMPERIAL.minH_in}" and ${LIMITS_IMPERIAL.maxH_ft}'${LIMITS_IMPERIAL.maxH_in}".`;
          heightFtInput.setAttribute('aria-invalid', 'true');
          heightInInput.setAttribute('aria-invalid', 'true');
          valid = false;
        }
      } else {
        valid = false;
      }
    }

    calcBtn.disabled = !valid;
    return valid;
  }

  [weightKgInput, weightLbInput, heightCmInput, heightFtInput, heightInInput].forEach(input => {
    input.addEventListener('input', () => {
      clearResult();
      validate();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!calcBtn.disabled) calculate();
      }
    });
  });

  // ---- Category logic ----
  function categoryFor(bmi) {
    if (bmi < 18.5) return 'under';
    if (bmi < 25) return 'normal';
    if (bmi < 30) return 'over';
    return 'obese';
  }

  // ---- Calculate ----
  function calculate() {
    if (!validate()) return;

    const weightKg = getWeightKg();
    const heightM = getHeightM();
    const bmi = weightKg / (heightM * heightM);
    const cat = categoryFor(bmi);
    const color = CATEGORY_COLORS[cat];

    resultNumber.textContent = bmi.toFixed(1);
    resultNumber.style.color = color;
    resultCategory.textContent = CATEGORY_NAMES[cat];
    resultCategory.style.color = color;

    // Healthy weight range for this height, in current unit
    const minKg = 18.5 * heightM * heightM;
    const maxKg = 24.9 * heightM * heightM;
    if (currentUnit() === 'metric') {
      resultRange.textContent = `Healthy range for your height: ${minKg.toFixed(0)}–${maxKg.toFixed(0)} kg`;
    } else {
      const minLb = minKg / 0.45359237;
      const maxLb = maxKg / 0.45359237;
      resultRange.textContent = `Healthy range for your height: ${minLb.toFixed(0)}–${maxLb.toFixed(0)} lb`;
    }

    legendTiles.forEach(t => t.classList.toggle('active', t.dataset.cat === cat));

    resultCard.classList.remove('visible');
    // reflow to restart transition
    resultCard.offsetHeight;
    requestAnimationFrame(() => resultCard.classList.add('visible'));
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    calculate();
  });

  resetBtn.addEventListener('click', () => {
    form.reset();
    unitMetric.checked = true;
    switchUnit();
    clearErrors();
    clearResult();
    calcBtn.disabled = true;
    weightKgInput.focus();
  });

  // Initial state
  switchUnit();
})();
</script>
</body>
</html>
